<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenHarmony Audit Agent · 操作记录回放</title>
<style>
:root{--bg:#101d25;--card:#172a33;--ink:#edf0e6;--muted:#a3bbc0;--mint:#abe0c8;--line:#30464e;--gold:#ead496}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}button{font:inherit;color:inherit;cursor:pointer}header{height:90px;border-bottom:1px solid var(--line);padding:22px 4vw;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:600}.brand small{font-size:12px;letter-spacing:2px;color:var(--mint);display:block}.tag{font-size:15px;color:var(--muted)}main{max-width:1920px;margin:auto;padding:38px 4vw 110px}.eyebrow{color:var(--mint);font:14px Consolas,monospace;letter-spacing:2px}h1{font-size:42px;line-height:1.3;font-weight:500;margin:16px 0 12px}.subtitle{color:var(--muted);margin:0 0 28px;font-size:21px}.grid{display:grid;grid-template-columns:310px 1fr;gap:32px}.side{display:flex;flex-direction:column;gap:12px}.step{border:1px solid var(--line);border-radius:7px;padding:13px 18px;color:var(--muted);font-size:17px}.step.active{background:#28483f;border-color:#81b99f;color:var(--mint)}.context{margin-top:12px;padding:20px;border-left:2px solid var(--gold);font-size:16px;color:var(--muted)}.panel{min-width:0;background:#0b171e;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:570px;display:flex;flex-direction:column}.panel-head{background:#1b2e37;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;justify-content:space-between;font-size:15px}.dots{color:var(--mint);letter-spacing:5px}.panel-body{padding:22px 28px;overflow:auto;flex:1;scroll-behavior:smooth}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:19px/1.72 Consolas,'Microsoft YaHei',monospace;color:#dce9e7}.command{color:var(--mint);padding-bottom:18px;border-bottom:1px solid #243942;margin-bottom:18px;min-height:40px}.output{color:#c3d5d8}.output h3{font-size:23px;color:var(--mint);margin:0 0 12px}.output p{font-size:20px;line-height:1.9;margin:0 0 20px}.output .small{font-size:16px;color:var(--muted)}.note{margin-top:22px;color:var(--muted);font-size:16px}.note b{color:var(--mint);font-weight:500}.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.metric{padding:26px;border:1px solid var(--line);border-radius:7px;background:var(--card)}.metric strong{display:block;font:42px/1.3 Consolas,monospace;color:var(--mint)}.metric span{display:block;margin-top:12px;color:var(--muted);font-size:17px}.row{padding:14px 0;border-bottom:1px solid var(--line)}.row b{color:var(--mint);font-weight:500}.code-line{display:block}.code-line.hot{background:#264039;color:#e8e0a4;margin:0 -12px;padding:0 12px}.line-number{color:#69848f;display:inline-block;width:52px}.check{border-left:3px solid var(--mint);padding:13px 20px;margin-bottom:18px;background:#172b31}.check b{font-size:21px;color:var(--mint)}.check p{margin:8px 0;font-size:18px}footer{position:fixed;bottom:0;left:0;right:0;height:84px;padding:18px 4vw;border-top:1px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:20px;z-index:3}footer button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:5px 18px;font-size:17px}footer button.next{background:var(--mint);color:#142c27}#position{font:16px Consolas,monospace;color:var(--mint)}#dots{display:flex;gap:8px;flex:1;justify-content:center}#dots button{padding:0;width:22px;height:5px;border:0;background:#40555e}#dots button.active{background:var(--mint)}#cursor{position:fixed;pointer-events:none;z-index:99;width:24px;height:24px;border:2px solid #d6f6e5;background:#9edabb44;border-radius:50%;display:none;box-shadow:0 0 0 6px #9edabb18}#cursor.click{background:var(--mint);box-shadow:0 0 0 14px #9edabb33}.progress{position:fixed;left:0;bottom:0;height:3px;background:var(--mint);z-index:9}#speech{display:none;background:#213c39;border:1px solid #74a88d;padding:22px;position:fixed;z-index:5;bottom:100px;left:8vw;right:8vw;font-size:23px}body.show-speech #speech{display:block}
@media(min-width:1700px){.panel{height:620px}h1{font-size:48px}.grid{grid-template-columns:350px 1fr}.step{font-size:19px;padding:16px 20px}.panel-body{padding:26px 32px}pre{font-size:21px}.subtitle{font-size:23px}}
@media(max-width:900px){header{height:auto;gap:20px}main{padding:24px 5vw 120px}.grid{grid-template-columns:1fr}.side{display:none}h1{font-size:29px}.panel{height:580px}pre{font-size:15px}.metric-grid{grid-template-columns:1fr}.metric strong{font-size:30px}.tag{font-size:11px}.brand{font-size:16px}#dots{display:none}footer{justify-content:space-between}}
</style></head><body>
<header><div class="brand">OpenHarmony Audit Agent<small>BINNNN LAB · OPERATION WALKTHROUGH</small></div><div class="tag">本次运行记录回放 · OpenHarmony c_utils · Codex</div></header>
<main><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><div class="grid"><aside class="side" id="side"></aside><section><div class="panel"><div class="panel-head"><span id="file"></span><span class="dots">● ● ●</span></div><div class="panel-body" id="body"><pre class="command" id="command"></pre><div class="output" id="output"></div></div></div><div class="note" id="note"></div></section></div></main>
<footer><span id="position"></span><button id="prev">← 上一段</button><div id="dots"></div><button id="speak">配音稿</button><button class="next" id="next">下一段 →</button></footer><div class="progress" id="progress"></div><div id="speech"></div><div id="cursor"></div>
<script>
const DATA=/*SESSION_DATA*/;
let current=0;
const stages=['工具与任务','环境与配置','校验与准备','运行与产物','源码与结果','原理与性能'];
const $=s=>document.querySelector(s);
function show(n,{animate=false}={}){current=Math.max(0,Math.min(DATA.scenes.length-1,n));const s=DATA.scenes[current];$('#eyebrow').textContent=String(current+1).padStart(2,'0')+' / '+s.label;$('#title').textContent=s.title;$('#subtitle').textContent=s.subtitle;$('#file').textContent=s.file;$('#command').textContent=animate?'':s.command;$('#command').hidden=!s.command;$('#output').innerHTML=animate?'':s.html;$('#note').innerHTML=s.note;$('#speech').textContent=s.speech;$('#position').textContent=String(current+1).padStart(2,'0')+' / '+DATA.scenes.length;$('#side').innerHTML=stages.map((t,i)=>'<div class="step '+(i===s.stage?'active':'')+'">0'+(i+1)+'　'+t+'</div>').join('')+'<div class="context">本次目标<br><b>commonlibrary_c_utils</b><br>base/src/parcel.cpp<br><br>版本<br>'+DATA.revision.slice(0,12)+'<br><br>三个函数的小范围源码审计</div>';$('#body').scrollTop=0;$('#dots').innerHTML=DATA.scenes.map((_,i)=>'<button aria-label="第'+(i+1)+'段" data-scene="'+i+'" class="'+(i===current?'active':'')+'"></button>').join('');$('#dots').querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.scene));$('#progress').style.width=(current+1)/DATA.scenes.length*100+'%';location.hash='scene-'+(current+1);}
$('#next').onclick=()=>show(current+1);$('#prev').onclick=()=>show(current-1);$('#speak').onclick=()=>document.body.classList.toggle('show-speech');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key.toLowerCase()==='n')$('#speak').click()});
window.player={show,scenes:DATA.scenes,reveal(){const s=DATA.scenes[current];$('#command').textContent=s.command;$('#output').innerHTML=s.html;},type(t){$('#command').textContent=t;}};
show(Math.max(0,Number(location.hash.replace('#scene-','')||1)-1));
</script></body></html>
