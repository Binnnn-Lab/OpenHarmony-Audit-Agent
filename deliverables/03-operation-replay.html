\n  ]\n}\u003c/pre>","note":"认证信息由运行环境提供；任务配置保存模型名和运行设置。","speech":"工作流配置决定用哪个运行时、哪个模型，以及安排多少工作单元。这里选的是 Codex，模型名称和并发设置都可以看到。后面的命令保持一致，换目标时，主要调整源码配置和分析范围。每次任务也会保存这些设置，方便之后核对。","duration":29,"start":120,"end":149},{"stage":2,"label":"VALIDATE","title":"校验配置与实际源码目录","subtitle":"检查提示词、目标路径和分析单元","file":"04-validate.json · 标准输出","command":"python -m openharmony_audit workflow validate\n  --workflow tmp/operation-demo/workflow.json\n  --target tmp/operation-demo/target.json --strict-source","html":"\u003cpre>{\n  &quot;status&quot;: &quot;VALID&quot;,\n  &quot;campaignId&quot;: &quot;parcel-operation-demo&quot;,\n  &quot;target&quot;: &quot;c-utils-parcel-demo&quot;\n}\n\u003c/pre>","note":"退出码：0 · strict-source 检查实际目录和文件是否存在。","speech":"配置写好后，运行 validate。这里加上 strict-source，检查实际源码目录和文件。命令返回 VALID，表示当前配置和路径检查通过，可以进入任务准备。路径或者配置有问题时，就在这一步根据错误信息修改。","duration":25,"start":149,"end":174},{"stage":2,"label":"PLAN","title":"查看任务分配","subtitle":"本次分析单元分给 worker-1","file":"plan · 分配字段","command":"python -m openharmony_audit workflow plan\n  --workflow tmp/operation-demo/workflow.json\n  --target tmp/operation-demo/target.json","html":"\u003cpre>{\n  &quot;schema&quot;: &quot;generic-audit-plan-v1&quot;,\n  &quot;campaignId&quot;: &quot;parcel-operation-demo&quot;,\n  &quot;workers&quot;: [\n    {\n      &quot;id&quot;: &quot;worker-1&quot;,\n      &quot;role&quot;: &quot;shard-controller&quot;,\n      &quot;units&quot;: [\n        {\n          &quot;id&quot;: &quot;parcel-write-buffer&quot;,\n          &quot;path&quot;: &quot;base/src/parcel.cpp&quot;,\n          &quot;focus&quot;: [\n            &quot;WriteBuffer&quot;,\n            &quot;EnsureWritableCapacity&quot;,\n            &quot;WriteDataBytes&quot;\n          ],\n          &quot;weight&quot;: 1,\n          &quot;metadata&quot;: {}\n        }\n      ],\n      &quot;subagentRoles&quot;: [\n        &quot;dataflow-lifetime&quot;\n      ],\n      &quot;candidateLimitPerUnit&quot;: 3\n    }\n  ]\n}\u003c/pre>","note":"画面摘取本次 plan 输出中的任务分配字段。","speech":"接着运行 plan，看任务怎么分。当前只有一个分析单元，所以分给 worker 一。这里列出了文件位置、关注的函数和角色设置。目标规模扩大后，可以配置更多分析单元，由规划器分配给不同工作单元。","duration":25,"start":174,"end":199},{"stage":2,"label":"PREPARE","title":"生成任务包，查看交接文件","subtitle":"assignment.json 固定范围，prompt.md 携带执行说明","file":"本次生成的 worker 目录","command":"python -m openharmony_audit workflow prepare\n  --workflow tmp/operation-demo/workflow.json\n  --target tmp/operation-demo/target.json\n  --run-root tmp/operation-demo/run","html":"\u003cpre>run/\n  plan.json\n  workers/worker-1/\n    assignment.json\n    prompt.md\n    roles.md\n    blind-verifier.md\n    checkpoint-prompt.md\n  shared/\n    candidates/\n    verification/\n    reports/\u003c/pre>","note":"文件由本次 prepare 命令生成。","speech":"prepare 会把计划变成实际文件。每个工作单元都有自己的任务分配、总控提示词、角色说明和检查点提示词。任务启动后，就从这些文件读取范围和要求。这样，配置、执行和后续检查都能对上同一份任务。","duration":26,"start":199,"end":225},{"stage":2,"label":"READY","title":"启动前查看状态","subtitle":"任务包已生成，worker 等待运行","file":"07-status-before.json · 标准输出","command":"python -m openharmony_audit workflow status --run-root tmp/operation-demo/run","html":"\u003cpre>{\n  &quot;campaignId&quot;: &quot;parcel-operation-demo&quot;,\n  &quot;workers&quot;: [\n    {\n      &quot;worker&quot;: &quot;worker-1&quot;,\n      &quot;status&quot;: {\n        &quot;state&quot;: &quot;NOT_STARTED&quot;,\n        &quot;terminal&quot;: false\n      }\n    }\n  ]\n}\n\u003c/pre>","note":"NOT_STARTED：当前任务尚未启动。","speech":"启动前可以用 status 看一下状态。这里显示 NOT_STARTED，说明任务包已经准备好，工作单元还在等待执行。后面仍然用这条命令查看进度和完成状态。","duration":20,"start":225,"end":245},{"stage":3,"label":"RUN","title":"启动任务，记录运行过程","subtitle":"Codex 读取任务与源码，检查结果写入 worker 目录","file":"08-run.json / events.json","command":"python -m openharmony_audit workflow run --run-root tmp/operation-demo/run","html":"\u003cdiv class=\"row\">\u003cb>运行入口\u003c/b>　workflow run\u003c/div>\u003cdiv class=\"row\">\u003cb>已记录的命令操作\u003c/b>　5 次\u003c/div>\u003cdiv class=\"row\">\u003cb>运行事件\u003c/b>　thread.started → turn.started → turn.completed\u003c/div>\u003cdiv class=\"row\">\u003cb>已完成的输出文件\u003c/b>　source-review.json、review-report.md、checkpoint.json、worker-state.json\u003c/div>\u003cp class=\"small\" style=\"margin-top:22px\">日志保存于 controller-001.stream.jsonl；本页摘取事件类型和产物名称。\u003c/p>","note":"运行等待段已剪辑。完整测量时长见后面的性能记录。","speech":"现在进入 run。工作流启动 Codex，读取任务包和目标源码。运行期间，事件会保存到日志里，文件操作和最后的状态也能查到。这次从指定的写入入口沿调用关系检查，随后把源码记录、报告和检查点写进工作单元目录。","duration":28,"start":245,"end":273},{"stage":3,"label":"COMPLETE","title":"任务完成，核对产物","subtitle":"状态文件与实际输出对应","file":"worker-state.json · 字段节选","command":"python -m openharmony_audit workflow status --run-root tmp/operation-demo/run","html":"\u003cpre>{\n  &quot;state&quot;: &quot;COMPLETE&quot;,\n  &quot;terminal&quot;: true,\n  &quot;scope&quot;: &quot;bounded-source-review&quot;,\n  &quot;completed_units&quot;: [\n    &quot;parcel-write-buffer&quot;\n  ],\n  &quot;artifacts&quot;: [\n    &quot;source-review.json&quot;,\n    &quot;review-report.md&quot;,\n    &quot;checkpoint.json&quot;,\n    &quot;worker-state.json&quot;\n  ],\n  &quot;candidate_count&quot;: 0\n}\u003c/pre>","note":"本次结果：限定范围源码检查完成，候选数量 0。","speech":"运行结束后，再看一次状态。现在显示 COMPLETE，下面列出了已经生成的四份文件。本次候选数量是零。接下来打开检查记录，看它读了哪些函数、查到了哪些保护条件，以及留下了哪些需要继续核对的问题。","duration":26,"start":273,"end":299},{"stage":4,"label":"SOURCE","title":"对照源码看检查依据","subtitle":"WriteBuffer：参数、补齐长度和写入顺序","file":"base/src/parcel.cpp · 409–432 行","command":"","html":"\u003cpre>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">409\u003c/span>bool Parcel::WriteBuffer(const void *data, size_t size)\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">410\u003c/span>{\u003c/span>\u003cspan class=\"code-line hot\">\u003cspan class=\"line-number\">411\u003c/span>    if (data == nullptr || size == 0) {\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">412\u003c/span>        return false;\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">413\u003c/span>    }\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">414\u003c/span>\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">415\u003c/span>    size_t padSize = GetPadSize(size);\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">416\u003c/span>    size_t desireCapacity = size + padSize;\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">417\u003c/span>\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">418\u003c/span>    // in case of desireCapacity overflow\u003c/span>\u003cspan class=\"code-line hot\">\u003cspan class=\"line-number\">419\u003c/span>    if (desireCapacity &lt; size || desireCapacity &lt; padSize) {\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">420\u003c/span>        return false;\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">421\u003c/span>    }\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">422\u003c/span>\u003c/span>\u003cspan class=\"code-line hot\">\u003cspan class=\"line-number\">423\u003c/span>    if (EnsureWritableCapacity(desireCapacity)) {\u003c/span>\u003cspan class=\"code-line hot\">\u003cspan class=\"line-number\">424\u003c/span>        if (!WriteDataBytes(data, size)) {\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">425\u003c/span>            return false;\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">426\u003c/span>        }\u003c/span>\u003cspan class=\"code-line hot\">\u003cspan class=\"line-number\">427\u003c/span>        WritePadBytes(padSize);\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">428\u003c/span>        return true;\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">429\u003c/span>    }\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">430\u003c/span>\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">431\u003c/span>    return false;\u003c/span>\u003cspan class=\"code-line \">\u003cspan class=\"line-number\">432\u003c/span>}\u003c/span>\u003c/pre>","note":"源码节选来源：OpenHarmony c_utils · Apache-2.0 · b807d3dadb7d","speech":"看一下实际源码。写入函数会检查空指针和零长度，然后计算补齐后的容量需求。高亮的位置检查加法是否回绕。继续往下，容量准备成功后才复制数据，复制成功后才处理补齐。记录里引用的行号，就对应这里的这些条件。","duration":29,"scroll":true,"start":299,"end":328},{"stage":4,"label":"CHECKS","title":"查看函数级检查记录","subtitle":"三个目标函数，以及沿调用关系检查的四个辅助函数","file":"source-review.json · checks 节选","command":"","html":"\u003cdiv class=\"check\">\u003cb>WriteBuffer\u003c/b>\u003cp>入口接收指针和长度，计算补齐后的需求容量；仅在容量检查和数据复制成功后补齐。\u003c/p>\u003cp class=\"small\">base/src/parcel.cpp:409-432；base/include/parcel.h:298-306\u003c/p>\u003c/div>\u003cdiv class=\"check\">\u003cb>EnsureWritableCapacity\u003c/b>\u003cp>空间不足时计算 desireCapacity + writeCursor_，再计算新容量并调用分配器；仅分配成功才更新内部指针和容量。\u003c/p>\u003cp class=\"small\">base/src/parcel.cpp:145-180\u003c/p>\u003c/div>\u003cdiv class=\"check\">\u003cb>WriteDataBytes\u003c/b>\u003cp>复制目标为 data_ + writeCursor_，以剩余可写容量作为 memcpy_s 的目标长度参数。\u003c/p>\u003cp class=\"small\">base/src/parcel.cpp:383-393\u003c/p>\u003c/div>","note":"总计 7 个函数；观察事实、保护条件和后续问题分别保存。","speech":"检查记录按函数整理。写入入口记录参数和补齐检查；容量函数记录可写状态、扩容条件和分配结果；复制函数记录剩余容量以及复制失败时的处理。每条都有源码位置，后续复核的人可以直接回到对应代码。","duration":27,"start":328,"end":355},{"stage":4,"label":"REPORT","title":"打开检查报告","subtitle":"将源码位置和检查结果整理为可读记录","file":"review-report.md · 前三项节选","command":"","html":"\u003cpre># Parcel 源码检查记录\n\n版本：`b807d3dadb7dbb7639fe85b3a5f72da18d318da2`，HEAD 一致，所查文件无工作区修改。依据目标 profile 的 `interfaces.source`，按入口、数据流、保护条件顺序检查。以下位置除注明外均在 `base/src/parcel.cpp`。\n\nWriteBuffer（409–432）：拒绝空指针、零长度及补齐加法回绕；容量和复制成功后才补齐。源区间有效性与别名约定待复核。\n\nEnsureWritableCapacity（145–180）：检查可写状态、已有容量路径的空指针、新容量增长和分配结果。159 行加法边界需结合状态不变量复核，未确认漏洞。\n\nWriteDataBytes（383–393）：将剩余容量传入 memcpy_s，仅成功后推进计数。库语义与源缓冲区寿命未验证。\u003c/pre>","note":"本次生成的报告文件，可与 source-review.json 交叉查看。","speech":"这份 Markdown 文件把检查结果整理成了文字报告。开头记录源码版本，后面按函数列出已检查的条件和后续问题。结构化记录方便程序继续处理，文字报告方便人工阅读。两份材料引用的是同一份代码和同一轮任务。","duration":27,"scroll":true,"start":355,"end":382},{"stage":4,"label":"CHECKPOINT","title":"查看检查点，保留工作进度","subtitle":"已完成函数、文件位置和下一步事项一起保存","file":"checkpoint.json · 字段节选","command":"","html":"\u003cpre>{\n  &quot;state&quot;: &quot;COMPLETE&quot;,\n  &quot;completed_functions&quot;: [\n    &quot;WriteBuffer&quot;,\n    &quot;EnsureWritableCapacity&quot;,\n    &quot;WriteDataBytes&quot;,\n    &quot;GetWritableBytes&quot;,\n    &quot;CalcNewCapacity&quot;,\n    &quot;GetPadSize&quot;,\n    &quot;WritePadBytes&quot;\n  ],\n  &quot;artifacts&quot;: [\n    &quot;source-review.json&quot;,\n    &quot;review-report.md&quot;,\n    &quot;checkpoint.json&quot;,\n    &quot;worker-state.json&quot;\n  ],\n  &quot;next_actions&quot;: [\n    &quot;人工复核 source-review.json 的准确位置、观察事实及后续问题。&quot;,\n    &quot;仅在另行授权扩展范围后，核对游标与容量不变量、源缓冲区别名约定及补齐访问前提。&quot;\n  ]\n}\u003c/pre>","note":"检查点由本次审计任务实际写入。","speech":"检查点里保存了已经看过的函数、对应文件，以及后续可以继续做的事。这次任务已经完成，记录仍然保留下来。对于时间较长的审计，这类信息能帮助恢复进度，也方便其他成员接手时了解工作做到哪里。","duration":27,"start":382,"end":409},{"stage":5,"label":"PRINCIPLE","title":"用容量示例解释路径检查","subtitle":"改变输入长度，观察保护条件怎样影响复制操作","file":"教学交互 · 容量约束","command":"","html":"\u003cdiv class=\"row\">\u003cb>目标容量\u003c/b>　64\u003c/div>\u003cdiv class=\"row\">\u003cb>输入长度 96\u003c/b>　超过容量 32\u003c/div>\u003cdiv class=\"row\">\u003cb>输入长度 32\u003c/b>　当前输入在容量以内\u003c/div>\u003cdiv class=\"row\">\u003cb>加入检查\u003c/b>　到达复制要求 n ≤ 64；越界要求 n &gt; 64\u003c/div>","note":"这一段使用教学模型说明原理；前面的源码检查结果保存在本次任务文件中。","speech":"这里穿插一个容量检查的教学例子。长度是九十六，容量是六十四，就会超出三十二。把长度改成三十二，这次输入落在容量以内。再加上完整的长度检查，超过容量就直接返回。路径核对要解决的，就是这些条件能否同时满足。主体把问题写清楚，再按需要交给辅助工具检查。","duration":42,"demo":true,"start":409,"end":451},{"stage":5,"label":"MEASUREMENT","title":"查看本次运行的耗时和内存","subtitle":"测量范围：本地工作流与 Codex 进程树","file":"measurement.json · 本次实测","command":"","html":"\u003cdiv class=\"metric-grid\">\u003cdiv class=\"metric\">\u003cstrong>129.60 s\u003c/strong>\u003cspan>任务墙钟时间\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong>385.45 MiB\u003c/strong>\u003cspan>进程树 RSS 最大采样值\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong>7\u003c/strong>\u003cspan>实际检查的函数\u003c/span>\u003c/div>\u003cdiv class=\"metric\">\u003cstrong>20 ms\u003c/strong>\u003cspan>配置的内存采样间隔\u003c/span>\u003c/div>\u003c/div>","note":"小范围 Parcel 源码检查；RSS 统计本地父子进程，远端模型资源另计。","speech":"最后看运行记录。这次小范围检查耗时大约一百三十秒，本地进程树采样到的峰值内存大约三百八十五兆字节。测量文件同时保存了代码版本、机器环境和退出码。后续换成更大的代码范围，可以沿用这套记录方式，再按目标规模和配置比较运行成本。","duration":32,"start":451,"end":483},{"stage":5,"label":"FINISH","title":"从同一份任务，找到配置、过程和结果","subtitle":"环境 → 目标 → 准备 → 执行 → 源码记录 → 检查报告","file":"操作演示结束","command":"","html":"\u003cdiv class=\"row\">\u003cb>配置与计划\u003c/b>　固定源码版本、函数范围和模型设置\u003c/div>\u003cdiv class=\"row\">\u003cb>执行与进度\u003c/b>　run 启动，status 查看状态，日志保留过程\u003c/div>\u003cdiv class=\"row\">\u003cb>本次结果\u003c/b>　7 个函数的源码检查记录，候选数量为 0\u003c/div>\u003cdiv class=\"row\">\u003cb>审计分工\u003c/b>　主体组织调查；CodeQL-AI 按需提供辅助依据\u003c/div>","note":"OpenHarmony Audit Agent · 工具使用与源码检查演示","speech":"这次演示完成了环境检查、目标配置、任务准备、实际运行和结果查看。使用时，可以从同一份任务找到配置、源码位置、检查记录和报告。后续接入具体漏洞案例时，再沿着对应候选补充复核和复现材料。以上就是本次操作演示，谢谢大家。","duration":31,"start":483,"end":514}]};
let current=0;
const stages=['工具与任务','环境与配置','校验与准备','运行与产物','源码与结果','原理与性能'];
const $=s=>document.querySelector(s);
function show(n,{animate=false}={}){current=Math.max(0,Math.min(DATA.scenes.length-1,n));const s=DATA.scenes[current];$('#eyebrow').textContent=String(current+1).padStart(2,'0')+' / '+s.label;$('#title').textContent=s.title;$('#subtitle').textContent=s.subtitle;$('#file').textContent=s.file;$('#command').textContent=animate?'':s.command;$('#command').hidden=!s.command;$('#output').innerHTML=animate?'':s.html;$('#note').innerHTML=s.note;$('#speech').textContent=s.speech;$('#position').textContent=String(current+1).padStart(2,'0')+' / '+DATA.scenes.length;$('#side').innerHTML=stages.map((t,i)=>'<div class="step '+(i===s.stage?'active':'')+'">0'+(i+1)+'　'+t+'</div>').join('')+'<div class="context">本次目标<br><b>commonlibrary_c_utils</b><br>base/src/parcel.cpp<br><br>版本<br>'+DATA.revision.slice(0,12)+'<br><br>三个函数的小范围源码审计</div>';$('#body').scrollTop=0;$('#dots').innerHTML=DATA.scenes.map((_,i)=>'<button aria-label="第'+(i+1)+'段" data-scene="'+i+'" class="'+(i===current?'active':'')+'"></button>').join('');$('#dots').querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.scene));$('#progress').style.width=(current+1)/DATA.scenes.length*100+'%';location.hash='scene-'+(current+1);}
$('#next').onclick=()=>show(current+1);$('#prev').onclick=()=>show(current-1);$('#speak').onclick=()=>document.body.classList.toggle('show-speech');document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key.toLowerCase()==='n')$('#speak').click()});
window.player={show,scenes:DATA.scenes,reveal(){const s=DATA.scenes[current];$('#command').textContent=s.command;$('#output').innerHTML=s.html;},type(t){$('#command').textContent=t;}};
show(Math.max(0,Number(location.hash.replace('#scene-','')||1)-1));
</script></body></html>
